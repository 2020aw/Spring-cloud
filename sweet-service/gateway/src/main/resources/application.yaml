server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: 192.168.32.1:8848   #nacos地址
    gateway:
      routes:
        - id: shopping-service
          uri: lb://shopping-service
          predicates:
            - Path=/shop/**
        - id: gift-service
          uri: lb://gift-service
          predicates:
            - Path=/gift/**